version: "3.8"

# Local development only. Production uses Heroku for the API, Appwrite for
# durable tenant-scoped storage, and Modal for GPU execution.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: neuromarketing-studio-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      DEBUG: "false"
      GPU_PROVIDER: modal
      MODAL_APP_NAME: neuromarketing-studio
      MODAL_FUNCTION_NAME: process_job
      EPHEMERAL_ROOT: /tmp/neuromarketing
    volumes:
      - ephemeral_data:/tmp/neuromarketing

  # Optional local GPU diagnostics. Normal development submits inference to
  # Modal and does not need this service. Start it with:
  # docker compose --profile local-gpu up worker
  worker:
    profiles: ["local-gpu"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: neuromarketing-studio-local-worker
    restart: "no"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
      EPHEMERAL_ROOT: /tmp/neuromarketing
      MODELS_DIR: /app/models
      ONNX_EXECUTION_PROVIDER: CUDAExecutionProvider
    volumes:
      - ephemeral_data:/tmp/neuromarketing
      - model_cache:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ephemeral_data:
  model_cache:
